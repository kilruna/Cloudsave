[package]
name = "cloudsave-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sync-Engine-Kern von Cloudsave"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
blake3 = "1"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
walkdir = "2"
tempfile = "3"
secret-service = { version = "6.0.0-rc.1", features = ["crypto-rust"] }
getrandom = "0.4"
globset = "0.4"
