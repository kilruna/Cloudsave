[package]
name = "cloudsave-app"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Oberfläche von Cloudsave"

[[bin]]
name = "cloudsave"
path = "src/main.rs"

[dependencies]
cloudsave-core = { path = "../cloudsave-core" }
gtk4 = { version = "0.10", features = ["v4_18"] }
libadwaita = { version = "0.8", features = ["v1_7"] }
