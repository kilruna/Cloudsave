[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[advisories]
yanked = "deny"

# notify is published under the CC0 public-domain dedication. Keep this scoped
# to the audited dependency/version rather than allowing new licenses globally.
[[licenses.exceptions]]
name = "notify"
version = "=8.2.2"
allow = ["CC0-1.0"]
