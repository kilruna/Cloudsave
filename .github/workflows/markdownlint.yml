name: Docs (Markdown-Lint)

on:
  push:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.json'
      - '.github/workflows/markdownlint.yml'

jobs:
  lint:
    name: Markdown-Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md'
          config: .markdownlint.json
