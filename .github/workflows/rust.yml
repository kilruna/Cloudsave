name: Rust

on:
  push:
  pull_request:
    paths:
      - 'crates/**'
      - 'tests/ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GTK4/libadwaita-Dev-Pakete (für gtk4-sys)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GTK4/libadwaita-Dev-Pakete (für gtk4-sys)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev librsvg2-common python3-gi gir1.2-gtk-3.0 xvfb xauth xdotool x11-utils dbus-daemon
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo nextest run --workspace --locked
      - name: Fenster- und Tray-Lifecycle (isolierter D-Bus/X11)
        run: |
          cargo build -p cloudsave-app --locked
          mkdir -p "$RUNNER_TEMP/cloudsave-ui"
          TMPDIR="$RUNNER_TEMP/cloudsave-ui" GSK_RENDERER=cairo xvfb-run -a \
            dbus-run-session -- env CLOUDSAVE_ISOLATED_TEST_BUS=1 \
            /usr/bin/python3 tests/ui/run_lifecycle_tests.py \
            --binary target/debug/cloudsave --output "$RUNNER_TEMP/cloudsave-lifecycle-results"
      - name: Lifecycle-Testbelege
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lifecycle-test-results
          path: ${{ runner.temp }}/cloudsave-lifecycle-results
          retention-days: 7
      - name: GTK-Regressionssuite und adaptives Dashboard (isoliertes Netzwerk)
        run: |
          sudo unshare --net -- runuser -u "$(id -un)" -- \
            env TMPDIR="$RUNNER_TEMP/cloudsave-ui" GSK_RENDERER=cairo \
            xvfb-run -a /usr/bin/python3 tests/ui/run_ui_tests.py \
            --binary target/debug/cloudsave --output "$RUNNER_TEMP/cloudsave-dashboard-results"
      - name: Dashboard-Testbelege
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-test-results
          path: ${{ runner.temp }}/cloudsave-dashboard-results
          retention-days: 7

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
